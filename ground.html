<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ground Team Portal - Mratyunjay World</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #4318ff;
      --danger: #ee5d50;
      --danger-bg: #fde8e8;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px 15px; }
    .container { max-width: 600px; margin: 0 auto; }

    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h2 { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    
    .card {
      background: var(--card-bg); padding: 20px; border-radius: 16px;
      border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }

    .search-box {
      width: 100%; padding: 14px 16px; border: 2px solid var(--primary);
      border-radius: 12px; font-size: 16px; font-weight: 700; text-transform: uppercase;
      outline: none; background: #ffffff;
    }

    .alert-no-info {
      background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger);
      padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px; margin: 12px 0;
      display: flex; align-items: center; gap: 8px;
    }

    .badge-info {
      background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 700; display: inline-block;
    }

    .form-group { margin-top: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }

    select, textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border-color);
      border-radius: 10px; font-size: 14px; font-weight: 600; outline: none; background: #f8fafc;
    }

    .btn-submit {
      background: var(--primary); color: white; border: none; padding: 14px;
      border-radius: 10px; font-weight: 800; font-size: 14px; width: 100%;
      cursor: pointer; margin-top: 14px; transition: background 0.2s;
    }
    .btn-submit:hover { background: #3311cc; }

    #loader { text-align: center; font-weight: 700; color: var(--primary); padding: 20px; }
    #noDataMsg { text-align: center; color: var(--text-muted); font-weight: 600; padding: 20px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2><i class="fa-solid fa-person-walking-luggage"></i> Ground Team Portal</h2>
    <span style="font-size:11px; opacity:0.8;">Mratyunjay World</span>
  </div>

  <div class="card">
    <input type="text" id="searchVehicle" class="search-box" placeholder="गाड़ी का नंबर डालें (e.g. PB11...)" onkeyup="searchVehicle()">
  </div>

  <div id="loader"><i class="fa-solid fa-spinner fa-spin"></i> Data Loading...</div>
  <div id="noDataMsg" style="display:none;">गाड़ी नंबर सर्च करें...</div>

  <div id="resultContainer"></div>
</div>

<script>
  // Google Apps Script Web App URL
  const API_URL = "https://script.google.com/macros/s/AKfycbwabLTNhYCMUQXeYdG0R323jiszvFT8pskRzy08h7a4IWWkHoq69d493au4lsHdvN-Uog/exec";

  let rawData = [];

  function loadData() {
    fetch(API_URL, { method: "GET", redirect: "follow" })
      .then(res => res.json())
      .then(data => {
        rawData = data;
        document.getElementById('loader').style.display = 'none';
        document.getElementById('noDataMsg').style.display = 'block';
      })
      .catch(err => {
        document.getElementById('loader').innerHTML = "<span style='color:red;'>डेटा लोड करने में समस्या आई!</span>";
      });
  }

  // index.html का getVal() फ़ंक्शन (Exact Copy)
  function getVal(row, possibleNames) {
    if (!row) return '';
    const keys = Object.keys(row);
    
    for (let name of possibleNames) {
      let matchedKey = keys.find(k => k.toLowerCase().trim() === name.toLowerCase().trim());
      if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== '') {
        return row[matchedKey];
      }
    }

    for (let name of possibleNames) {
      let matchedKey = keys.find(k => k.toLowerCase().includes(name.toLowerCase()));
      if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== '') {
        return row[matchedKey];
      }
    }
    return '';
  }

  // index.html का getVehicleNumber() फ़ंक्शन (Exact Copy)
  function getVehicleNumber(row) {
    let veh = getVal(row, ['Vehicle Reg No', 'Vehicle Registration No', 'Vehicle Number', 'Vehicle No', 'Veh No', 'Reg No', 'Vehicle No.']);
    
    if (veh && !veh.toUpperCase().startsWith('TRAX') && !veh.toUpperCase().startsWith('IMEI') && veh.length < 15) {
      return veh;
    }

    const keys = Object.keys(row);
    for (let k of keys) {
      let val = (row[k] || '').toString().trim();
      if (val.match(/^[A-Z]{2}[0-9]{1,2}[A-Z]{0,3}[0-9]{4}$/i)) {
        return val;
      }
    }
    return veh || 'N/A';
  }

  // केवल अक्षरों और अंकों को साफ़ करने के लिए (Space / Dash Insensitive Matching)
  function sanitize(str) {
    if (!str) return '';
    return str.toString().replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  }

  // index.html के लॉजिक पर आधारित सर्च
  function searchVehicle() {
    const rawQuery = document.getElementById('searchVehicle').value.trim();
    const cleanQuery = sanitize(rawQuery);
    const container = document.getElementById('resultContainer');
    const noDataMsg = document.getElementById('noDataMsg');
    container.innerHTML = '';

    if (rawQuery.length < 2) {
      noDataMsg.innerText = "गाड़ी नंबर सर्च करें...";
      noDataMsg.style.display = 'block';
      return;
    }

    // index.html की तरह पूरा रो + गाड़ी नंबर दोनों मैच करेगा
    const filtered = rawData.filter(row => {
      const vehNo = getVehicleNumber(row);
      const cleanVehNo = sanitize(vehNo);

      // 1. सीधे गाड़ी नंबर से मैच करें
      if (cleanVehNo.includes(cleanQuery)) return true;

      // 2. index.html की तरह रो की सभी वैल्यू में मैच करें
      return Object.values(row).some(v => 
        v !== null && v !== undefined && sanitize(v).includes(cleanQuery)
      );
    });

    if (filtered.length === 0) {
      noDataMsg.innerText = "कोई गाड़ी नहीं मिली!";
      noDataMsg.style.display = 'block';
      return;
    }

    noDataMsg.style.display = 'none';

    filtered.forEach((row, index) => {
      const vehNo = getVehicleNumber(row);
      const remark = getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']) || 'Pending';
      const owner = getVal(row, ['PERMIT HOLDER NAME', 'Permit Holder Name', 'Owner Name', 'Owner', 'Customer Name', 'Party Name', 'Transporter', 'Client']) || '-';

      const remClean = sanitize(remark);
      const isNoInfo = remClean.includes('NOINFO') || remark.trim() === '' || remClean.includes('PENDING');

      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="font-size:18px; font-weight:800; color:var(--primary);">${vehNo}</h3>
          <span class="badge-info">${remark}</span>
        </div>
        
        <div style="font-size:12px; color:var(--text-muted); margin-top:4px; font-weight:600;">
          Owner: <strong>${owner}</strong>
        </div>

        ${isNoInfo ? `
          <div class="alert-no-info">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:18px;"></i>
            <span>ALERT: गाड़ी LIVE करवाना आवश्यक है!</span>
          </div>
        ` : ''}

        <div class="form-group">
          <label>Ground Team Response Status:</label>
          <select id="groundStatus-${index}">
            <option value="NOW VEHICLE LIVE">NOW VEHICLE LIVE</option>
            <option value="OTHER ISSUE">OTHER ISSUE</option>
            <option value="NEED MORE TIME">NEED MORE TIME</option>
          </select>
        </div>

        <div class="form-group">
          <label>Additional Details (Optional):</label>
          <textarea id="groundRemark-${index}" placeholder="कोई अन्य टिप्पणी यहाँ लिखें..."></textarea>
        </div>

        <button class="btn-submit" onclick="submitGroundUpdate('${vehNo}', ${index})">
          <i class="fa-solid fa-paper-plane"></i> Update Status
        </button>
      `;
      container.appendChild(card);
    });
  }

  function submitGroundUpdate(vehNo, index) {
    const status = document.getElementById(`groundStatus-${index}`).value;
    const remark = document.getElementById(`groundRemark-${index}`).value;

    alert(`गाड़ी ${vehNo} का स्टेटस "${status}" अपडेट किया जा रहा है...`);

    fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        vehicleNo: vehNo,
        status: status,
        remark: remark
      })
    })
    .then(() => {
      alert("स्टेटस सफलतापूर्वक अपडेट हो गया!");
      loadData();
    })
    .catch(err => alert("अपडेट में त्रुटि हुई: " + err));
  }

  loadData();
</script>

</body>
</html>
