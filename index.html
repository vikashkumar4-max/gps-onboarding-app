<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Onboarding & Activation Portal</title>
  <style>
    :root {
      --primary: #1a73e8;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #202124;
      --success: #34a853;
      --warning: #fbbc04;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      font-size: 15px;
    }
    button:hover {
      background-color: #1557b0;
    }
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
      font-size: 14px;
    }
    th {
      background-color: #f1f3f4;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-pending { background: #fef7e0; color: #b06000; }
    .badge-active { background: #e6f4ea; color: #137333; }
    .checklist label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .checklist input[type="checkbox"] {
      width: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📡 GPS Device Onboarding & Activation Portal</h1>
    <p>PAN INDIA Lead Capture to Vehicle Activation Lifecycle</p>
  </div>

  <!-- SECTION 1: PAN INDIA ENTRY FORM -->
  <div class="card">
    <h2>1. PAN INDIA Form Entry</h2>
    <form id="gpsForm">
      <div class="grid">
        <div class="form-group">
          <label>Owner Name</label>
          <input type="text" id="ownerName" placeholder="e.g. Rahul Sharma" required>
        </div>
        <div class="form-group">
          <label>Owner Contact</label>
          <input type="tel" id="ownerContact" placeholder="e.g. 9876543210" required>
        </div>
        <div class="form-group">
          <label>Vehicle Number</label>
          <input type="text" id="vehicleNumber" placeholder="e.g. DL 01 AB 1234" required>
        </div>
        <div class="form-group">
          <label>Device Category</label>
          <select id="deviceCategory" required>
            <option value="Wired Tracker">Wired Tracker</option>
            <option value="OBD Device">OBD Plug & Play</option>
            <option value="Asset Tracker">Asset Tracker (Magnetic)</option>
          </select>
        </div>
        <div class="form-group">
          <label>IMEI Number</label>
          <input type="text" id="imei" placeholder="15-digit IMEI number" required>
        </div>
      </div>
      <button type="submit">Submit to PAN INDIA Sheet</button>
    </form>
  </div>

  <!-- SECTION 2: LIVE PIPELINE & ACTIVATION -->
  <div class="card">
    <h2>2. Operational Pipeline & Activation Checks</h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Vehicle & Owner</th>
            <th>IMEI & Category</th>
            <th>SIM Top-Up</th>
            <th>Tagging</th>
            <th>Quality Checks</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="deviceTableBody">
          <!-- Dynamic Content -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let devices = [];

  document.getElementById('gpsForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const newDevice = {
      id: Date.now(),
      owner: document.getElementById('ownerName').value,
      contact: document.getElementById('ownerContact').value,
      vehicle: document.getElementById('vehicleNumber').value,
      category: document.getElementById('deviceCategory').value,
      imei: document.getElementById('imei').value,
      topup: false,
      tagged: true,
      checks: { livePing: false, ignition: false, powerAlert: false },
      status: 'Pending Top-Up'
    };

    devices.push(newDevice);
    this.reset();
    renderTable();
  });

  function toggleTopup(id) {
    const device = devices.find(d => d.id === id);
    if(device) {
      device.topup = !device.topup;
      updateStatus(device);
      renderTable();
    }
  }

  function toggleCheck(id, checkType) {
    const device = devices.find(d => d.id === id);
    if(device) {
      device.checks[checkType] = !device.checks[checkType];
      updateStatus(device);
      renderTable();
    }
  }

  function updateStatus(device) {
    if (!device.topup) {
      device.status = 'Pending Top-Up';
    } else if (device.checks.livePing && device.checks.ignition && device.checks.powerAlert) {
      device.status = 'Activated';
    } else {
      device.status = 'Pending Checks';
    }
  }

  function renderTable() {
    const tbody = document.getElementById('deviceTableBody');
    tbody.innerHTML = '';

    if (devices.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No records found. Submit entry above.</td></tr>';
      return;
    }

    devices.forEach(d => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${d.vehicle}</strong><br><small>${d.owner} (${d.contact})</small></td>
        <td>${d.category}<br><small>IMEI: ${d.imei}</small></td>
        <td>
          <button style="padding:6px 10px; font-size:12px; background:${d.topup ? '#34a853' : '#ea4335'}" onclick="toggleTopup(${d.id})">
            ${d.topup ? 'Done ✓' : 'Mark Topup'}
          </button>
        </td>
        <td><span style="color:green; font-weight:bold;">Tagged ✓</span></td>
        <td class="checklist">
          <label><input type="checkbox" ${d.checks.livePing ? 'checked' : ''} onclick="toggleCheck(${d.id}, 'livePing')"> Live Location</label>
          <label><input type="checkbox" ${d.checks.ignition ? 'checked' : ''} onclick="toggleCheck(${d.id}, 'ignition')"> Ignition Status</label>
          <label><input type="checkbox" ${d.checks.powerAlert ? 'checked' : ''} onclick="toggleCheck(${d.id}, 'powerAlert')"> Power Alert</label>
        </td>
        <td>
          <span class="badge ${d.status === 'Activated' ? 'badge-active' : 'badge-pending'}">${d.status}</span>
        </td>
        <td>
          ${d.status === 'Activated' ? '🟢 Live' : '⏳ In Progress'}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  renderTable();
</script>

</body>
</html>
