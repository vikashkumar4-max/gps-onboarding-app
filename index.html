<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process App Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f7fe; color: #333; padding: 20px; }
    
    header { margin-bottom: 20px; }
    header h1 { color: #1b2559; font-size: 24px; }

    .metrics-container { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
    .card { background: white; padding: 15px; border-radius: 8px; flex: 1; min-width: 180px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card p { font-size: 12px; color: #707ebe; font-weight: bold; }
    .card h2 { font-size: 24px; color: #1b2559; margin-top: 5px; }

    .data-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .controls { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .search-box { padding: 8px 12px; width: 250px; border: 1px solid #ccc; border-radius: 5px; }

    .table-responsive { overflow-x: auto; max-height: 500px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background-color: #007bff; color: white; padding: 10px; text-align: left; position: sticky; top: 0; }
    td { padding: 10px; border-bottom: 1px solid #ddd; white-space: nowrap; }
    tr:nth-child(even) { background-color: #f9f9f9; }

    #loader { text-align: center; padding: 30px; font-weight: bold; color: #007bff; }
  </style>
</head>
<body>

  <header>
    <h1>Process App Dashboard</h1>
  </header>

  <div class="metrics-container">
    <div class="card">
      <p>TOTAL RECORDS</p>
      <h2 id="totalCount">0</h2>
    </div>
    <div class="card">
      <p>CERTIFICATE ISSUED</p>
      <h2 id="issuedCount" style="color: green;">0</h2>
    </div>
    <div class="card">
      <p>OTHER / DEBOARDED</p>
      <h2 id="deboardedCount" style="color: red;">0</h2>
    </div>
  </div>

  <div class="data-section">
    <div class="controls">
      <h3>Vehicle Data</h3>
      <input type="text" id="searchInput" class="search-box" placeholder="Search..." onkeyup="filterTable()">
    </div>

    <div id="loader">Data Load Ho Raha Hai...</div>

    <div class="table-responsive">
      <table id="dataTable" style="display:none;">
        <thead><tr id="tableHeaders"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // ⚠️ YAHAN APNA NAYA WEB APP URL PASTE KAREIN
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzAx6Hm5-dwsSbfdUdu63tw3JP1cz1SXg0wscgFT5GpeKXKcCr9dxvIx3kzf4opJgy0/exec";

    let rawData = [];

    // JSONP Technique to Bypass CORS Block
    function loadDataJSONP() {
      const script = document.createElement('script');
      script.src = SCRIPT_URL + "?callback=handleData";
      document.body.appendChild(script);
    }

    // Callback Function executed when data arrives
    function handleData(data) {
      if (!data || data.length === 0) {
        document.getElementById('loader').innerText = "Sheet me koi data nahi mila!";
        return;
      }

      rawData = data;
      document.getElementById('loader').style.display = 'none';
      document.getElementById('dataTable').style.display = 'table';

      // 1. Metrics Update
      document.getElementById('totalCount').innerText = data.length;
      let issued = 0, deboarded = 0;

      data.forEach(item => {
        let remarks = (item['Remarks'] || item['Portal'] || '').toString().toLowerCase();
        if (remarks.includes('issued')) issued++;
        else if (remarks.includes('deboarded') || remarks.includes('mins')) deboarded++;
      });

      document.getElementById('issuedCount').innerText = issued;
      document.getElementById('deboardedCount').innerText = deboarded;

      // 2. Render Table Headers
      const headers = Object.keys(data[0]);
      const headerTr = document.getElementById('tableHeaders');
      headerTr.innerHTML = '';
      headers.forEach(h => {
        const th = document.createElement('th');
        th.innerText = h;
        headerTr.appendChild(th);
      });

      // 3. Render Rows
      renderRows(data, headers);
    }

    function renderRows(data, headers) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      data.forEach(row => {
        const tr = document.createElement('tr');
        headers.forEach(h => {
          const td = document.createElement('td');
          let val = row[h] !== undefined ? row[h] : '';
          if (typeof val === 'string' && val.includes('T') && val.includes('Z')) {
            val = val.split('T')[0];
          }
          td.innerText = val;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function filterTable() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = rawData.filter(row => 
        Object.values(row).some(v => v.toString().toLowerCase().includes(q))
      );
      if (rawData.length > 0) renderRows(filtered, Object.keys(rawData[0]));
    }

    // Call JSONP Load
    loadDataJSONP();
  </script>
</body>
</html>
