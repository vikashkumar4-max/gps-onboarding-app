<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process App Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f4f7fe; color: #333; padding: 20px; }
    
    header { margin-bottom: 20px; }
    header h1 { color: #1b2559; font-size: 26px; }

    .metrics-container { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
    .card { background: white; padding: 18px; border-radius: 10px; flex: 1; min-width: 180px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .card p { font-size: 12px; color: #707ebe; font-weight: 600; text-transform: uppercase; }
    .card h2 { font-size: 26px; color: #1b2559; margin-top: 5px; }

    .data-section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .controls { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .search-box { padding: 8px 14px; width: 280px; border: 1px solid #dce2f0; border-radius: 6px; font-size: 14px; outline: none; }

    .table-responsive { overflow-x: auto; max-height: 500px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background-color: #f7f9fc; color: #1b2559; padding: 12px; font-weight: 600; position: sticky; top: 0; border-bottom: 2px solid #e0e5f2; white-space: nowrap; }
    td { padding: 10px 12px; border-bottom: 1px solid #e0e5f2; color: #2b3674; white-space: nowrap; }
    tr:hover { background-color: #f8f9ff; }

    #loader { text-align: center; padding: 30px; font-size: 15px; color: #4318ff; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h1>Process App Dashboard</h1>
  </header>

  <div class="metrics-container">
    <div class="card">
      <p>Total Records</p>
      <h2 id="totalCount">0</h2>
    </div>
    <div class="card">
      <p>Certificate Issued</p>
      <h2 id="issuedCount" style="color: #05cd99;">0</h2>
    </div>
    <div class="card">
      <p>Other / Deboarded</p>
      <h2 id="deboardedCount" style="color: #ff5630;">0</h2>
    </div>
  </div>

  <div class="data-section">
    <div class="controls">
      <h3>Vehicle Data</h3>
      <input type="text" id="searchInput" class="search-box" placeholder="Search Vehicle, IMEI, Owner..." onkeyup="filterTable()">
    </div>

    <div id="loader">Data Load Ho Raha Hai...</div>

    <div class="table-responsive">
      <table id="dataTable" style="display: none;">
        <thead><tr id="tableHeaders"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // ⚠️ APNA GOOGLE SCRIPT WEB APP URL ISME PASTE KAREIN
    const API_URL = "https://script.google.com/macros/s/AKfycbyigV12SM1lP1ggAyP2r0mXFlIonmuIQosOenElfDD9oOMHOFZOPZN0CEiJrGo9l_4/exec";

    let rawData = [];

    async function fetchData() {
      const loader = document.getElementById('loader');
      try {
        // Fetch with automatic redirect handling
        const response = await fetch(API_URL, { redirect: "follow" });
        rawData = await response.json();

        if (!rawData || rawData.length === 0) {
          loader.innerText = "Sheet me koi data nahi mila!";
          return;
        }

        renderDashboard(rawData);
      } catch (error) {
        console.error("Error:", error);
        loader.innerHTML = "<b style='color:red;'>Data Fetch Failed! Check Console (F12) or URL.</b>";
      }
    }

    function renderDashboard(data) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('dataTable').style.display = 'table';

      document.getElementById('totalCount').innerText = data.length;

      let issued = 0, deboarded = 0;
      data.forEach(item => {
        let remarks = (item['Remarks'] || item['Portal'] || '').toString().toLowerCase();
        if (remarks.includes('issued')) issued++;
        else if (remarks.includes('deboarded') || remarks.includes('mins')) deboarded++;
      });

      document.getElementById('issuedCount').innerText = issued;
      document.getElementById('deboardedCount').innerText = deboarded;

      const headers = Object.keys(data[0]);
      const headerTr = document.getElementById('tableHeaders');
      headerTr.innerHTML = '';
      headers.forEach(h => {
        const th = document.createElement('th');
        th.innerText = h;
        headerTr.appendChild(th);
      });

      renderRows(data, headers);
    }

    function renderRows(data, headers) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      data.forEach(row => {
        const tr = document.createElement('tr');
        headers.forEach(h => {
          const td = document.createElement('td');
          let val = row[h] !== undefined ? row[h] : '';
          if (typeof val === 'string' && val.includes('T') && val.includes('Z')) {
            val = val.split('T')[0];
          }
          td.innerText = val;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function filterTable() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = rawData.filter(row => 
        Object.values(row).some(v => v.toString().toLowerCase().includes(q))
      );
      if (rawData.length > 0) renderRows(filtered, Object.keys(rawData[0]));
    }

    fetchData();
  </script>
</body>
</html>
