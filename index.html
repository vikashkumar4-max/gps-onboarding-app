<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PAA LIVE DASHBOARD</title>
  
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      /* Theme Custom Palette */
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      
      --success: #10b981;
      --success-bg: #ecfdf5;
      
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      
      --warning: #f59e0b;
      --warning-bg: #fffbeb;
      
      --border-color: #e2e8f0;
      --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      background-image: radial-gradient(#cbd5e1 0.75px, transparent 0.75px);
      background-size: 16px 16px;
      color: var(--text-main); 
      padding: 16px; 
      min-height: 100vh; 
    }

    .container {
      max-width: 1350px;
      margin: 0 auto;
    }

    /* Executive Header */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #0b132b 0%, #1c2541 60%, #3a506b 100%);
      padding: 20px 24px;
      border-radius: 18px;
      color: white;
      box-shadow: 0 12px 24px -6px rgba(11, 19, 43, 0.3);
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Truck Logo Styling */
    .user-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      background: #ffffff;
    }

    .header-title-box h1 { 
      font-size: 22px; 
      font-weight: 800; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      letter-spacing: -0.3px;
    }

    .header-title-box p { 
      font-size: 12.5px; 
      color: #94a3b8; 
      margin-top: 3px; 
      font-weight: 500;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-badge { 
      background: rgba(255, 255, 255, 0.08); 
      padding: 8px 14px; 
      border-radius: 30px; 
      font-size: 11.5px; 
      font-weight: 600; 
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-badge .dot {
      width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981;
    }

    /* KPI Metric Cards Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .metric-card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .metric-info p { 
      font-size: 10px; 
      color: var(--text-muted); 
      font-weight: 800; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }
    .metric-info h2 { 
      font-size: 26px; 
      font-weight: 800; 
      color: var(--text-main); 
      margin-top: 4px; 
    }

    .metric-icon { 
      width: 46px; 
      height: 46px; 
      border-radius: 12px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 20px; 
    }

    .icon-total { background: #e0f2fe; color: #0284c7; }
    .icon-issued { background: var(--success-bg); color: var(--success); }
    .icon-pending { background: var(--danger-bg); color: var(--danger); }
    .icon-action { background: #fef3c7; color: #d97706; }

    /* Main Table Container Card */
    .main-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }

    .filter-bar { 
      display: flex; 
      flex-direction: column;
      gap: 12px; 
      margin-bottom: 18px; 
    }
    
    .filter-group { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      width: 100%; 
    }

    .search-wrapper { position: relative; width: 100%; }
    .search-wrapper i { 
      position: absolute; 
      left: 14px; 
      top: 50%; 
      transform: translateY(-50%); 
      color: var(--text-muted); 
      font-size: 14px;
    }
    
    .search-input {
      width: 100%; 
      padding: 12px 14px 12px 38px; 
      border: 1px solid var(--border-color); 
      border-radius: 10px; 
      font-size: 13px; 
      outline: none; 
      background: #f8fafc;
      color: var(--text-main);
      font-weight: 500;
    }

    .select-filter { 
      width: 100%;
      padding: 12px 14px; 
      border: 1px solid var(--border-color); 
      border-radius: 10px; 
      font-size: 13px; 
      outline: none; 
      background: #f8fafc; 
      color: var(--text-main); 
      font-weight: 600; 
    }

    /* Table Mobile Responsive Scroll */
    .table-container { 
      overflow-x: auto; 
      border-radius: 12px; 
      border: 1px solid var(--border-color); 
      -webkit-overflow-scrolling: touch;
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; min-width: 520px; }
    
    thead tr { background-color: #f8fafc; }
    th { padding: 14px 16px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }

    .btn-vehicle {
      background: #eff6ff; 
      color: #2563eb; 
      font-weight: 700; 
      padding: 6px 12px; 
      border-radius: 8px; 
      border: 1px solid #bfdbfe; 
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .btn-view {
      background: #f1f5f9; 
      color: #334155; 
      font-weight: 600; 
      padding: 6px 12px; 
      border-radius: 8px; 
      border: 1px solid #cbd5e1; 
      font-size: 11px;
      cursor: pointer;
    }

    .badge { 
      padding: 5px 10px; 
      border-radius: 20px; 
      font-size: 11px; 
      font-weight: 700; 
      display: inline-flex; 
      align-items: center; 
      gap: 5px; 
      white-space: nowrap;
    }
    .badge-issued { background-color: var(--success-bg); color: #047857; }
    .badge-pending { background-color: var(--danger-bg); color: #b91c1c; }
    .badge-warning { background-color: #fef3c7; color: #b45309; }

    /* Detail Modal Overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.75); 
      backdrop-filter: blur(4px); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 1000;
      padding: 14px;
    }

    .modal-card { 
      background: #ffffff; 
      width: 100%; 
      max-width: 520px; 
      border-radius: 18px; 
      overflow: hidden; 
      box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.25); 
    }

    .modal-header { 
      background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%); 
      color: white; 
      padding: 16px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .modal-header h3 { font-size: 16px; font-weight: 700; }

    .close-modal { 
      background: rgba(255,255,255,0.15); 
      border: none; 
      color: white; 
      width: 30px; 
      height: 30px; 
      border-radius: 50%; 
      font-size: 18px; 
      cursor: pointer;
    }

    .modal-body { padding: 18px; max-height: 75vh; overflow-y: auto; }
    .detail-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    
    .detail-item { 
      background: #f8fafc; 
      padding: 10px 12px; 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
    }
    .detail-label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
    .detail-value { font-size: 13px; color: var(--text-main); font-weight: 700; margin-top: 2px; word-break: break-word; }

    #loader { text-align: center; padding: 40px 10px; color: var(--primary); font-weight: 700; font-size: 14px; }

    /* Desktop Adjustments */
    @media (min-width: 768px) {
      body { padding: 32px 24px; }
      .metrics-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
      .filter-bar { flex-direction: row; justify-content: space-between; align-items: center; }
      .filter-group { flex-direction: row; width: 100%; }
      .search-wrapper { width: 320px; }
      .detail-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Custom Header Section -->
    <div class="dashboard-header">
      <div class="header-left">
        <!-- 🚚 Truck Logo Image -->
        <img src="https://img.freepik.com/free-vector/delivery-truck-logistics-icon_24877-83561.jpg" alt="Truck Logo" class="user-avatar" id="userAvatar">
        
        <div class="header-title-box">
          <!-- Updated Title -->
          <h1>🚛 PAA LIVE DASHBOARD</h1>
          <p>Managed by <strong>MRATYUNJAY</strong> • Real-time Sync ⚡</p>
        </div>
      </div>

      <div class="header-right">
        <div class="header-badge">
          <span class="dot"></span> Live Sheet Sync
        </div>
      </div>
    </div>

    <!-- KPI Metric Cards Grid -->
    <div class="metrics-grid">
      <div class="metric-card" onclick="filterByCard('ALL')">
        <div class="metric-info">
          <p>Total Cases 📁</p>
          <h2 id="totalCases">0</h2>
        </div>
        <div class="metric-icon icon-total"><i class="fa-solid fa-folder-closed"></i></div>
      </div>

      <div class="metric-card" onclick="filterByCard('ISSUED')">
        <div class="metric-info">
          <p>Certificate Issued</p>
          <h2 id="issuedCount" style="color: var(--success);">0</h2>
        </div>
        <div class="metric-icon icon-issued"><i class="fa-solid fa-circle-check"></i></div>
      </div>

      <div class="metric-card" onclick="filterByCard('PENDING')">
        <div class="metric-info">
          <p>Pending ⏳</p>
          <h2 id="pendingCount" style="color: var(--danger);">0</h2>
        </div>
        <div class="metric-icon icon-pending"><i class="fa-solid fa-triangle-exclamation"></i></div>
      </div>

      <div class="metric-card" onclick="filterByCard('NEED_ACTION')">
        <div class="metric-info">
          <p>Need Action 🛠️</p>
          <h2 id="actionableCount" style="color: var(--warning);">0</h2>
        </div>
        <div class="metric-icon icon-action"><i class="fa-solid fa-bolt-lightning"></i></div>
      </div>
    </div>

    <!-- Main Data Table Container Card -->
    <div class="main-card">
      <div class="filter-bar">
        <div class="filter-group">
          <!-- 📍 State Selection Option (Left Column) -->
          <select id="stateFilter" class="select-filter" style="max-width: 220px;" onchange="applyFilters()">
            <option value="ALL">All States 🗺️</option>
          </select>

          <!-- Status / Remark Dropdown Filter -->
          <select id="remarkFilter" class="select-filter" style="max-width: 240px;" onchange="applyFilters()">
            <option value="ALL">All Status / Remarks</option>
            <option value="ISSUED">Certificate Issued</option>
            <option value="PENDING">Total Pending</option>
            <option value="NEED_ACTION">Need Action</option>
          </select>

          <!-- 🔍 Search Bar (Moved to the Right) -->
          <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search Vehicle, Owner, State..." onkeyup="applyFilters()">
          </div>
        </div>
      </div>

      <div id="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading Dashboard Data...</div>

      <div class="table-container" id="tableWrapper" style="display: none;">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Vehicle No.</th>
              <th>Status</th>
              <th>Owner / Company</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalVehicleTitle"><i class="fa-solid fa-truck"></i> Vehicle Details</h3>
        <button class="close-modal" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="detail-grid" id="modalDetailContent"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyHslvgv_ZLu_tkuxi6Pi3jBxbiCnzTlYSBy6YVoVIg53JBPDqzFXcvtbyjrlAnWiE/exec";

    let rawData = [];
    let currentFilteredData = [];

    function loadDataWithJSONP() {
      const script = document.createElement('script');
      script.src = API_URL + "?callback=handleDataResponse";
      script.onerror = function() {
        document.getElementById('loader').innerHTML = "<span style='color:red;'>Script Load Failed! Web App URL check karein.</span>";
      };
      document.body.appendChild(script);
    }

    function handleDataResponse(data) {
      if (!data || data.length === 0 || data.error) {
        document.getElementById('loader').innerHTML = "<span style='color:red;'>Sheet me data nahi mila!</span>";
        return;
      }

      rawData = data;
      currentFilteredData = rawData;

      populateStateFilter(rawData);
      populateRemarkFilter(rawData);
      calculateMetrics(rawData);
      renderTable(rawData);

      document.getElementById('loader').style.display = 'none';
      document.getElementById('tableWrapper').style.display = 'block';
    }

    // Flexible Value Fetcher for various column headers
    function getVal(row, possibleNames) {
      if (!row) return '';
      const keys = Object.keys(row);
      
      for (let name of possibleNames) {
        let matchedKey = keys.find(k => k.toLowerCase().trim() === name.toLowerCase().trim());
        if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== '') {
          return row[matchedKey];
        }
      }

      for (let name of possibleNames) {
        let matchedKey = keys.find(k => k.toLowerCase().includes(name.toLowerCase()));
        if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== '') {
          return row[matchedKey];
        }
      }
      return '';
    }

    // Populate Dynamic State Dropdown Filter
    function populateStateFilter(data) {
      const dropdown = document.getElementById('stateFilter');
      let optionsHTML = `<option value="ALL">All States 🗺️</option>`;

      const uniqueStates = new Set();
      data.forEach(row => {
        let state = getVal(row, ['State', 'State Name', 'RTO State', 'Location State']);
        if (state && state.toString().trim() !== '') {
          uniqueStates.add(state.toString().trim());
        }
      });

      Array.from(uniqueStates).sort().forEach(st => {
        optionsHTML += `<option value="${st}">${st}</option>`;
      });

      dropdown.innerHTML = optionsHTML;
    }

    function populateRemarkFilter(data) {
      const dropdown = document.getElementById('remarkFilter');
      let optionsHTML = `
        <option value="ALL">All Status / Remarks</option>
        <option value="ISSUED">Certificate Issued</option>
        <option value="PENDING">Total Pending</option>
        <option value="NEED_ACTION">Need Action</option>
        <option disabled>────────── Sheet Remarks ──────────</option>
      `;

      const uniqueRemarks = new Set();
      data.forEach(row => {
        let remark = getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']);
        if (remark && remark.toString().trim() !== '') {
          uniqueRemarks.add(remark.toString().trim());
        }
      });

      Array.from(uniqueRemarks).sort().forEach(rem => {
        optionsHTML += `<option value="EXACT:${rem}">${rem}</option>`;
      });

      dropdown.innerHTML = optionsHTML;
    }

    function getVehicleNumber(row) {
      let veh = getVal(row, ['Vehicle Reg No', 'Vehicle Registration No', 'Vehicle Number', 'Vehicle No', 'Veh No', 'Reg No']);
      if (veh && !veh.toUpperCase().startsWith('TRAX') && !veh.toUpperCase().startsWith('IMEI') && veh.length < 15) {
        return veh;
      }
      const keys = Object.keys(row);
      for (let k of keys) {
        let val = (row[k] || '').toString().trim();
        if (val.match(/^[A-Z]{2}[0-9]{1,2}[A-Z]{0,3}[0-9]{4}$/i)) return val;
      }
      return veh || 'N/A';
    }

    // Explicit function to safely retrieve Owner Name
    function getOwnerName(row) {
      return getVal(row, ['Owner Name', 'Owner', 'Customer Name', 'Party Name', 'Client Name', 'Customer', 'Party']) || 'N/A';
    }

    function isNeedActionStatus(remark) {
      let rem = remark.toString().toLowerCase();
      return rem.includes('activation pending') || rem.includes('check not clear') || rem.includes('topup pending') || rem.includes('top up pending');
    }

    // Calculate Dynamic Metrics based on current State & Status filtering
    function calculateMetrics(data) {
      let total = data.length, issued = 0, pending = 0, needAction = 0;
      data.forEach(row => {
        let remark = (getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']) || '').toString();
        let remLower = remark.toLowerCase();
        if (remLower.includes('issued') || remLower.includes('done') || remLower.includes('completed')) {
          issued++;
        } else {
          pending++;
        }
        if (isNeedActionStatus(remark)) needAction++;
      });

      document.getElementById('totalCases').innerText = total;
      document.getElementById('issuedCount').innerText = issued;
      document.getElementById('pendingCount').innerText = pending;
      document.getElementById('actionableCount').innerText = needAction;
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--text-muted);">No matching records found.</td></tr>`;
        return;
      }

      data.forEach((row, index) => {
        const vehicleNo = getVehicleNumber(row);
        const remark = getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']) || 'Pending';
        const owner = getOwnerName(row);

        let remarkBadge = `<span class="badge badge-warning">⚡ ${remark}</span>`;
        let remLower = remark.toString().toLowerCase();

        if (remLower.includes('issued') || remLower.includes('done') || remLower.includes('completed')) {
          remarkBadge = `<span class="badge badge-issued"><i class="fa-solid fa-check"></i> ${remark}</span>`;
        } else if (remLower.includes('deboarded') || remLower.includes('failed')) {
          remarkBadge = `<span class="badge badge-pending"><i class="fa-solid fa-xmark"></i> ${remark}</span>`;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${index + 1}</strong></td>
          <td>
            <button class="btn-vehicle" onclick="openVehicleDetail(${index})">
              <i class="fa-solid fa-bus"></i> ${vehicleNo}
            </button>
          </td>
          <td>${remarkBadge}</td>
          <td><strong>${owner}</strong></td>
          <td>
            <button class="btn-view" onclick="openVehicleDetail(${index})">
              <i class="fa-regular fa-eye"></i> View All
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterByCard(filterType) {
      const dropdown = document.getElementById('remarkFilter');
      if (dropdown) {
        dropdown.value = filterType;
        applyFilters();
      }
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('remarkFilter').value;
      const selectedState = document.getElementById('stateFilter').value;

      currentFilteredData = rawData.filter(row => {
        // Search matching
        const matchesSearch = Object.values(row).some(v => 
          v !== null && v !== undefined && v.toString().toLowerCase().includes(query)
        );

        // State matching
        const rowState = (getVal(row, ['State', 'State Name', 'RTO State', 'Location State']) || '').toString().trim();
        let matchesState = (selectedState === 'ALL') || (rowState === selectedState);

        // Status matching
        const remark = (getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']) || '').toString();
        let remLower = remark.toLowerCase();
        let matchesStatus = true;

        if (statusFilter === 'ISSUED') {
          matchesStatus = remLower.includes('issued') || remLower.includes('done') || remLower.includes('completed');
        } else if (statusFilter === 'PENDING') {
          matchesStatus = !remLower.includes('issued') && !remLower.includes('done') && !remLower.includes('completed');
        } else if (statusFilter === 'NEED_ACTION') {
          matchesStatus = isNeedActionStatus(remark);
        } else if (statusFilter.startsWith('EXACT:')) {
          let exactVal = statusFilter.replace('EXACT:', '');
          matchesStatus = (remark.trim() === exactVal);
        }

        return matchesSearch && matchesState && matchesStatus;
      });

      // Recalculate KPI metrics and re-render table with filtered data
      calculateMetrics(currentFilteredData);
      renderTable(currentFilteredData);
    }

    function openVehicleDetail(index) {
      const rowData = currentFilteredData[index];
      const vehicleNo = getVehicleNumber(rowData);

      document.getElementById('modalVehicleTitle').innerHTML = `<i class="fa-solid fa-truck"></i> ${vehicleNo}`;
      const modalContent = document.getElementById('modalDetailContent');
      modalContent.innerHTML = '';

      Object.keys(rowData).forEach(key => {
        let val = rowData[key];
        if (val === undefined || val === '') val = '-';
        if (typeof val === 'string' && val.includes('T') && val.includes('Z')) val = val.split('T')[0];

        const item = document.createElement('div');
        item.className = 'detail-item';
        item.innerHTML = `<div class="detail-label">${key}</div><div class="detail-value">${val}</div>`;
        modalContent.appendChild(item);
      });

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

    window.onclick = function(event) {
      const modal = document.getElementById('detailModal');
