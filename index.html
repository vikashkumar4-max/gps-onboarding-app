<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manu certification status</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #4318ff;
      --primary-hover: #3311cc;
      --primary-light: #f0f3ff;
      
      --success: #05cd99;
      --success-bg: #e6f9f0;
      
      --danger: #ee5d50;
      --danger-bg: #fde8e8;
      
      --warning: #ffb547;
      --warning-bg: #fff8e7;
      
      --border-color: #e2e8f0;
      --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.03);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.02);
      --shadow-lg: 0 20px 30px -10px rgba(15, 23, 42, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      padding: 32px 24px; 
      min-height: 100vh; 
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1350px;
      margin: 0 auto;
    }

    /* Executive Header */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 26px 36px;
      border-radius: 20px;
      color: white;
      box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.25);
      position: relative;
      overflow: hidden;
      flex-wrap: wrap;
      gap: 15px;
    }

    .dashboard-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(67,24,255,0.25) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
    }

    .dashboard-header h1 { 
      font-size: 24px; 
      font-weight: 800; 
      display: flex; 
      align-items: center; 
      gap: 14px; 
      letter-spacing: -0.5px;
    }
    .dashboard-header h1 i {
      color: #38bdf8;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 12px;
      font-size: 20px;
    }

    .dashboard-header p { 
      font-size: 13px; 
      color: #94a3b8; 
      margin-top: 6px; 
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-ground-team {
      background: #4318ff;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(67, 24, 255, 0.4);
    }
    .btn-ground-team:hover {
      background: #3311cc;
      transform: translateY(-2px);
    }

    .header-badge { 
      background: rgba(255, 255, 255, 0.08); 
      padding: 8px 16px; 
      border-radius: 30px; 
      font-size: 12px; 
      font-weight: 600; 
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-badge .dot {
      width: 8px; height: 8px; background: #05cd99; border-radius: 50%; box-shadow: 0 0 10px #05cd99;
    }

    /* KPI Metric Cards Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .metric-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .metric-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(67, 24, 255, 0.4);
    }

    .metric-info p { 
      font-size: 11px; 
      color: var(--text-muted); 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.8px;
    }
    .metric-info h2 { 
      font-size: 32px; 
      font-weight: 800; 
      color: var(--text-main); 
      margin-top: 8px; 
      letter-spacing: -1px;
    }

    .metric-icon { 
      width: 54px; 
      height: 54px; 
      border-radius: 14px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 22px; 
      transition: transform 0.3s;
    }
    .metric-card:hover .metric-icon {
      transform: scale(1.1);
    }

    .icon-total { background: #e0f2fe; color: #0284c7; }
    .icon-issued { background: var(--success-bg); color: var(--success); }
    .icon-pending { background: var(--danger-bg); color: var(--danger); }
    .icon-action { background: var(--warning-bg); color: var(--warning); }

    /* Main Table Container Card */
    .main-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }

    .filter-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      gap: 16px; 
      margin-bottom: 24px; 
    }
    .filter-group { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

    .search-wrapper { position: relative; width: 300px; }
    .search-wrapper i { 
      position: absolute; 
      left: 16px; 
      top: 50%; 
      transform: translateY(-50%); 
      color: var(--text-muted); 
      font-size: 14px;
    }
    
    .search-input {
      width: 100%; 
      padding: 12px 16px 12px 42px; 
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      font-size: 13px; 
      outline: none; 
      background: #f8fafc;
      color: var(--text-main);
      font-weight: 500;
      transition: all 0.2s;
    }
    .search-input:focus { 
      border-color: var(--primary); 
      background: #ffffff; 
      box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1); 
    }

    .select-filter { 
      padding: 12px 18px; 
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      font-size: 13px; 
      outline: none; 
      background: #f8fafc; 
      color: var(--text-main); 
      font-weight: 600; 
      cursor: pointer;
      max-width: 320px;
      transition: all 0.2s;
    }
    .select-filter:focus { border-color: var(--primary); background: #ffffff; }

    .btn-export { 
      background: var(--text-main); 
      color: #ffffff; 
      border: none; 
      padding: 12px 20px; 
      border-radius: 12px; 
      font-size: 13px; 
      font-weight: 700; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      transition: all 0.2s;
    }
    .btn-export:hover { 
      background: var(--primary); 
      box-shadow: 0 6px 16px rgba(67, 24, 255, 0.25);
    }

    .sync-timestamp {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Table Styling */
    .table-container { 
      overflow-x: auto; 
      border-radius: 14px; 
      border: 1px solid var(--border-color); 
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; }
    
    thead tr { background-color: #f1f5f9; border-bottom: 1px solid var(--border-color); }
    th { 
      padding: 16px 20px; 
      font-weight: 700; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      font-size: 11px; 
      letter-spacing: 0.8px; 
    }
    
    td { 
      padding: 16px 20px; 
      border-bottom: 1px solid var(--border-color); 
      color: var(--text-main); 
      vertical-align: middle; 
      font-weight: 500;
    }
    
    tbody tr { transition: background-color 0.15s; }
    tbody tr:hover { background-color: #f8fafc; }
    tbody tr:last-child td { border-bottom: none; }

    .btn-vehicle {
      background: var(--primary-light); 
      color: var(--primary); 
      font-weight: 700; 
      padding: 8px 14px; 
      border-radius: 8px; 
      border: 1px solid rgba(67, 24, 255, 0.15); 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn-vehicle:hover { 
      background: var(--primary); 
      color: #ffffff; 
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(67, 24, 255, 0.2);
    }

    .btn-view {
      background: #f1f5f9; 
      color: #475569; 
      font-weight: 600; 
      padding: 8px 14px; 
      border-radius: 8px; 
      border: 1px solid #cbd5e1; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-view:hover { background: #e2e8f0; color: #0f172a; }

    .badge { 
      padding: 6px 12px; 
      border-radius: 30px; 
      font-size: 11.5px; 
      font-weight: 700; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
    }
    .badge-issued { background-color: var(--success-bg); color: #047857; }
    .badge-pending { background-color: var(--danger-bg); color: #b91c1c; }
    .badge-warning { background-color: var(--warning-bg); color: #b45309; }

    /* Modal Detail Overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); 
      backdrop-filter: blur(8px); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 1000;
    }

    .modal-card { 
      background: #ffffff; 
      width: 90%; 
      max-width: 620px; 
      border-radius: 20px; 
      overflow: hidden; 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); 
      border: 1px solid var(--border-color);
    }

    .modal-header { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      color: white; 
      padding: 22px 28px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .modal-header h3 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }

    .close-modal { 
      background: rgba(255,255,255,0.1); 
      border: none; 
      color: white; 
      width: 32px; 
      height: 32px; 
      border-radius: 50%; 
      cursor: pointer; 
      font-size: 18px; 
    }
    .close-modal:hover { background: rgba(255,255,255,0.25); }

    .modal-body { padding: 28px; max-height: 70vh; overflow-y: auto; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    
    .detail-item { 
      background: #f8fafc; 
      padding: 14px 16px; 
      border-radius: 12px; 
      border: 1px solid var(--border-color); 
    }
    .detail-label { font-size: 10.5px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }
    .detail-value { font-size: 14px; color: var(--text-main); font-weight: 700; margin-top: 5px; word-break: break-word; }

    #loader { text-align: center; padding: 50px; color: var(--primary); font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="dashboard-header">
      <div>
        <h1><i class="fa-solid fa-truck-monster"></i> Mratyunjay World</h1>
        <p>managed by MRATYUNJAY </p>
      </div>

      <div class="header-actions">
        <!-- New Link to Ground Team Portal -->
        <a href="ground.html" target="_blank" class="btn-ground-team">
          <i class="fa-solid fa-user-gear"></i> Ground Team Portal ➔
        </a>
        
        <div class="header-badge">
          <span class="dot"></span> Live Sync Active
        </div>
      </div>
    </div>

    <!-- KPI Metric Cards -->
    <div class="metrics-grid">
      <div class="metric-card" onclick="filterByCard('ALL')" title="Click to view all cases">
        <div class="metric-info">
          <p>Total Cases</p>
          <h2 id="totalCases">0</h2>
        </div>
        <div class="metric-icon icon-total"><i class="fa-solid fa-folder-closed"></i></div>
      </div>

      <div class="metric-card" onclick="filterByCard('ISSUED')" title="Click to view Issued cases">
        <div class="metric-info">
          <p>Certificate Issued</p>
          <h2 id="issuedCount" style="color: var(--success);">0</h2>
        </div>
        <div class="metric-icon icon-issued"><i class="fa-solid fa-circle-check"></i></div>
      </div>

      <div class="metric-card" onclick="filterByCard('PENDING')" title="Click to view Pending cases">
        <div class="metric-info">
          <p>Total Pendency</p>
          <h2 id="pendingCount" style="color: var(--danger);">0</h2>
        </div>
        <div class="metric-icon icon-pending"><i class="fa-solid fa-triangle-exclamation"></i></div>
      </div>

      <div class="metric-card" onclick="filterByCard('NEED_ACTION')" title="Click to view Actionable cases">
        <div class="metric-info">
          <p>Need Action</p>
          <h2 id="actionableCount" style="color: var(--warning);">0</h2>
        </div>
        <div class="metric-icon icon-action"><i class="fa-solid fa-bolt-lightning"></i></div>
      </div>
    </div>

    <!-- Main Table Container Card -->
    <div class="main-card" id="mainTableCard">
      <div class="filter-bar">
        <div class="filter-group">
          <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search Vehicle, IMEI, Owner..." onkeyup="applyFilters()">
          </div>
          
          <!-- Dynamic Select Dropdown -->
          <select id="remarkFilter" class="select-filter" onchange="applyFilters()">
            <option value="ALL">All Status / Remarks</option>
            <option value="ISSUED">Certificate Issued</option>
            <option value="PENDING">Total Pending</option>
            <option value="NEED_ACTION">Need Action (3 Specific Conditions)</option>
          </select>
        </div>

        <div style="display: flex; align-items: center; gap: 15px;">
          <span class="sync-timestamp" id="syncTime">
            <i class="fa-solid fa-arrows-rotate"></i> Last Synced: --
          </span>
          <button class="btn-export" onclick="exportDataToCSV()"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
        </div>
      </div>

      <div id="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Fetching Live Data...</div>

      <div class="table-container" id="tableWrapper" style="display: none;">
        <table>
          <thead>
            <tr>
              <th>S.No.</th>
              <th>Vehicle Number</th>
              <th>Remark / Status</th>
              <th>Owner / Company</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalVehicleTitle"><i class="fa-solid fa-truck"></i> Vehicle Details</h3>
        <button class="close-modal" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="detail-grid" id="modalDetailContent"></div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ यहाँ अपना नया Google Apps Script Deploy किया हुआ Web App URL डालें
    const API_URL = "https://script.google.com/macros/s/AKfycbyNb329KNwYVoC-f0ceBIWg_oBFLGJlvE54kBFtEmCnJwcnrHsm6DMQ2aipIxI83i7W_g/exec";

    let rawData = [];
    let currentFilteredData = [];

    function loadData() {
      fetch(API_URL, {
        method: "GET",
        redirect: "follow"
      })
      .then(response => {
        if (!response.ok) throw new Error("HTTP error " + response.status);
        return response.json();
      })
      .then(data => {
        handleDataResponse(data);
      })
      .catch(error => {
        console.error("Fetch Error:", error);
        document.getElementById('loader').innerHTML = "<span style='color:red;'>Script load failed! Check Web App URL access permissions.</span>";
      });
    }

    function handleDataResponse(data) {
      if (!data || data.length === 0 || data.error) {
        document.getElementById('loader').innerHTML = "<span style='color:red;'>Sheet me data nahi mila!</span>";
        return;
      }

      rawData = data;
      currentFilteredData = rawData;

      populateRemarkFilter(rawData);
      calculateMetrics(rawData);
      renderTable(rawData);
      updateSyncTime();

      document.getElementById('loader').style.display = 'none';
      document.getElementById('tableWrapper').style.display = 'block';
    }

    function updateSyncTime() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('syncTime').innerHTML = `<i class="fa-solid fa-arrows-rotate"></i> Last Synced: ${timeStr}`;
    }

    function getVal(row, possibleNames) {
      if (!row) return '';
      const keys = Object.keys(row);
      
      for (let name of possibleNames) {
        let matchedKey = keys.find(k => k.toLowerCase().trim() === name.toLowerCase().trim());
        if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== '') {
          return row[matchedKey];
        }
      }

      for (let name of possibleNames) {
        let matchedKey = keys.find(k => k.toLowerCase().includes(name.toLowerCase()));
        if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== '') {
          return row[matchedKey];
        }
      }
      return '';
    }

    function populateRemarkFilter(data) {
      const dropdown = document.getElementById('remarkFilter');
      
      let optionsHTML = `
        <option value="ALL">All Status / Remarks</option>
        <option value="ISSUED">Certificate Issued</option>
        <option value="PENDING">Total Pending</option>
        <option value="NEED_ACTION">Need Action (3 Specific Conditions)</option>
        <option disabled>────────── Sheet Remarks ──────────</option>
      `;

      const uniqueRemarks = new Set();

      data.forEach(row => {
        let remark = getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']);
        if (remark && remark.toString().trim() !== '') {
          uniqueRemarks.add(remark.toString().trim());
        }
      });

      Array.from(uniqueRemarks).sort().forEach(rem => {
        optionsHTML += `<option value="EXACT:${rem}">${rem}</option>`;
      });

      dropdown.innerHTML = optionsHTML;
    }

    function getVehicleNumber(row) {
      let veh = getVal(row, ['Vehicle Reg No', 'Vehicle Registration No', 'Vehicle Number', 'Vehicle No', 'Veh No', 'Reg No', 'Vehicle No.']);
      
      if (veh && !veh.toUpperCase().startsWith('TRAX') && !veh.toUpperCase().startsWith('IMEI') && veh.length < 15) {
        return veh;
      }

      const keys = Object.keys(row);
      for (let k of keys) {
        let val = (row[k] || '').toString().trim();
        if (val.match(/^[A-Z]{2}[0-9]{1,2}[A-Z]{0,3}[0-9]{4}$/i)) {
          return val;
        }
      }
      return veh || 'N/A';
    }

    function isNeedActionStatus(remark) {
      let rem = remark.toString().toLowerCase();
      return rem.includes('activation pending') || 
             rem.includes('check not clear') || 
             rem.includes('topup pending') || 
             rem.includes('top up pending');
    }

    function calculateMetrics(data) {
      let total = data.length;
      let issued = 0, pending = 0, needAction = 0;

      data.forEach(row => {
        let remark = (getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status', 'Cert Status']) || '').toString();
        let remLower = remark.toLowerCase();

        if (remLower.includes('issued') || remLower.includes('done') || remLower.includes('completed') || remLower.includes('certificate')) {
          issued++;
        } else {
          pending++;
        }

        if (isNeedActionStatus(remark)) {
          needAction++;
        }
      });

      document.getElementById('totalCases').innerText = total;
      document.getElementById('issuedCount').innerText = issued;
      document.getElementById('pendingCount').innerText = pending;
      document.getElementById('actionableCount').innerText = needAction;
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:36px; color:var(--text-muted);">No matching vehicle records found.</td></tr>`;
        return;
      }

      data.forEach((row, index) => {
        const vehicleNo = getVehicleNumber(row);
        const remark = getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']) || 'Pending';
        const owner = getVal(row, ['PERMIT HOLDER NAME', 'Permit Holder Name', 'Owner Name', 'Owner', 'Customer Name', 'Party Name', 'Transporter', 'Client']) || '-';

        let remarkBadge = `<span class="badge badge-warning"><i class="fa-solid fa-clock"></i> ${remark}</span>`;
        let remLower = remark.toString().toLowerCase();

        if (remLower.includes('issued') || remLower.includes('done') || remLower.includes('completed')) {
          remarkBadge = `<span class="badge badge-issued"><i class="fa-solid fa-check"></i> ${remark}</span>`;
        } else if (remLower.includes('deboarded') || remLower.includes('failed')) {
          remarkBadge = `<span class="badge badge-pending"><i class="fa-solid fa-xmark"></i> ${remark}</span>`;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${index + 1}</strong></td>
          <td>
            <button class="btn-vehicle" onclick="openVehicleDetail(${index})">
              <i class="fa-solid fa-truck-front"></i> ${vehicleNo}
            </button>
          </td>
          <td>${remarkBadge}</td>
          <td><strong>${owner}</strong></td>
          <td>
            <button class="btn-view" onclick="openVehicleDetail(${index})">
              <i class="fa-solid fa-eye"></i> View All
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterByCard(filterType) {
      const dropdown = document.getElementById('remarkFilter');
      if (dropdown) {
        dropdown.value = filterType;
        applyFilters();

        document.getElementById('mainTableCard').scrollIntoView({ 
          behavior: 'smooth', 
          block: 'start' 
        });
      }
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('remarkFilter').value;

      currentFilteredData = rawData.filter(row => {
        const matchesSearch = Object.values(row).some(v => 
          v !== null && v !== undefined && v.toString().toLowerCase().includes(query)
        );
        const remark = (getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']) || '').toString();
        let remLower = remark.toLowerCase();
        let matchesStatus = true;

        if (statusFilter === 'ISSUED') {
          matchesStatus = remLower.includes('issued') || remLower.includes('done') || remLower.includes('completed');
        } else if (statusFilter === 'PENDING') {
          matchesStatus = !remLower.includes('issued') && !remLower.includes('done') && !remLower.includes('completed');
        } else if (statusFilter === 'NEED_ACTION') {
          matchesStatus = isNeedActionStatus(remark);
        } else if (statusFilter.startsWith('EXACT:')) {
          let exactVal = statusFilter.replace('EXACT:', '');
          matchesStatus = (remark.trim() === exactVal);
        }

        return matchesSearch && matchesStatus;
      });

      renderTable(currentFilteredData);
    }

    function openVehicleDetail(index) {
      const rowData = currentFilteredData[index];
      const vehicleNo = getVehicleNumber(rowData);

      document.getElementById('modalVehicleTitle').innerHTML = `<i class="fa-solid fa-truck-front"></i> ${vehicleNo}`;
      const modalContent = document.getElementById('modalDetailContent');
      modalContent.innerHTML = '';

      Object.keys(rowData).forEach(key => {
        let val = rowData[key];
        if (val === undefined || val === '') val = '-';
        if (typeof val === 'string' && val.includes('T') && val.includes('Z')) val = val.split('T')[0];

        const item = document.createElement('div');
        item.className = 'detail-item';
        item.innerHTML = `<div class="detail-label">${key}</div><div class="detail-value">${val}</div>`;
        modalContent.appendChild(item);
      });

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

    function exportDataToCSV() {
      if (!currentFilteredData || currentFilteredData.length === 0) return alert("Export ke liye koi data nahi hai!");
      let csv = '';
      const headers = Object.keys(currentFilteredData[0]);
      csv += headers.join(',') + '\n';
      currentFilteredData.forEach(row => {
        csv += headers.map(h => `"${(row[h]||'').toString().replace(/"/g, '""')}"`).join(',') + '\n';
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = window.URL.createObjectURL(blob);
      a.download = `Vehicle_Data_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    window.onclick = function(event) {
      const modal = document.getElementById('detailModal');
      if (event.target === modal) closeModal();
    };

    // Initialize Fetching
    loadData();
  </script>
</body>
</html>
