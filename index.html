<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Onboarding Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0d1322; background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px; padding: 24px; color: #f8fafc; min-height: 100vh; }
    
    /* Top Header */
    .header { background: linear-gradient(135deg, #111827 0%, #1e293b 100%); padding: 16px 24px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); margin-bottom: 24px; }
    .profile-section { display: flex; align-items: center; gap: 14px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #3b82f6; object-fit: cover; }
    .profile-info h2 { font-size: 18px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .profile-info p { font-size: 12px; color: #94a3b8; font-weight: 500; margin-top: 2px; }
    .sync-badge { background: rgba(59, 130, 246, 0.15); color: #60a5fa; padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(59, 130, 246, 0.3); }

    /* Metrics Cards Grid */
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border-radius: 16px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
    .card-info span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; }
    .card-info h3 { font-size: 32px; font-weight: 800; margin-top: 4px; line-height: 1; }
    .card-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    
    .card.total h3 { color: #f8fafc; }
    .card.total .card-icon { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
    .card.issued h3 { color: #10b981; }
    .card.issued .card-icon { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .card.pending h3 { color: #ef4444; }
    .card.pending .card-icon { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

    /* Main Content Area */
    .main-section { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border-radius: 16px; padding: 24px; border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    
    .search-box { position: relative; flex: 1; min-width: 250px; }
    .search-box input { width: 100%; background: #0b0f19; border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 16px 12px 40px; border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: 0.2s; }
    .search-box input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; }

    .select-box select { background: #0b0f19; border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 16px; border-radius: 10px; color: #fff; font-size: 14px; outline: none; cursor: pointer; }

    /* Table */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 14px 16px; color: #64748b; font-size: 11px; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    td { padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 14px; color: #cbd5e1; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .badge-status { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; }
    .badge-issued { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-pending { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .btn-action { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-action:hover { background: #3b82f6; color: #fff; }

    /* Glass Popup Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: #111827; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 520px; border-radius: 20px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
    .modal-header { background: #1f2937; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .modal-header h3 { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .close-btn { background: rgba(255,255,255,0.05); border: none; color: #94a3b8; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .close-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    
    .modal-body { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .detail-card { background: #0b0f19; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .detail-key { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-val { font-size: 13px; font-weight: 600; color: #f1f5f9; margin-top: 4px; word-break: break-all; }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div class="header">
    <div class="profile-section">
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200" class="avatar" alt="Avatar">
      <div class="profile-info">
        <h2>🚛 Mratyunjay world</h2>
        <p>Managed by MRATYUNJAY</p>
      </div>
    </div>
    <div class="sync-badge">Real-time Sync ⚡</div>
  </div>

  <!-- Top Stat Cards -->
  <div class="metrics-grid">
    <div class="card total">
      <div class="card-info"><span>Total Cases</span><h3 id="totalCases">0</h3></div>
      <div class="card-icon">📁</div>
    </div>
    <div class="card issued">
      <div class="card-info"><span>Certificate Issued</span><h3 id="issuedCases">0</h3></div>
      <div class="card-icon">✅</div>
    </div>
    <div class="card pending">
      <div class="card-info"><span>Pending Cases</span><h3 id="pendingCases">0</h3></div>
      <div class="card-icon">⏳</div>
    </div>
  </div>

  <!-- Search Table Section -->
  <div class="main-section">
    <div class="controls">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" oninput="filterData()" placeholder="Search Vehicle, IMEI...">
      </div>
      <div class="select-box">
        <select id="statusFilter" onchange="filterData()">
          <option value="ALL">All Status / Remarks</option>
          <option value="ISSUED">Issued</option>
          <option value="PENDING">Pending</option>
        </select>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Vehicle No</th>
            <th>Status</th>
            <th>State</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5" style="text-align:center; padding: 30px; color:#64748b;">Syncing data from Google Sheet...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Detail Popup Modal -->
  <div class="modal" id="detailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Vehicle Details</h3>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    // ⚠️ Put your Apps Script Web App Deployment URL here:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkRmL6i-nj9IVCuYWHVDXC71w29wuE2bMknID-JfDyFqohA3-TQcXMUpBQsSAkQah0Cw/exec"; 
    
    let fullData = [];

    async function fetchData() {
      try {
        const response = await fetch(SCRIPT_URL);
        const rawData = await response.json();
        
        const rows = rawData.slice(1);
        
        fullData = rows.map((cols, index) => ({
          id: index + 1,
          date: cols[0] || 'N/A',
          portal: cols[1] || 'N/A',
          status: cols[2] ? cols[2].toString().trim() : 'PENDING',
          imei: cols[3] || 'N/A',
          vltd: cols[4] || 'N/A',
          iccid: cols[5] || 'N/A',
          rto: cols[8] || 'N/A',
          state: cols[9] || 'N/A',
          vehicleNo: cols[17] || 'N/A',
          holder: cols[20] || 'N/A',
          phone: cols[21] || 'N/A'
        }));

        updateMetrics(fullData);
        renderTable(fullData);
      } catch (err) {
        document.getElementById("tableBody").innerHTML = `
          <tr><td colspan="5" style="color:#ef4444; text-align:center; padding:25px;">
            Script Load Failed! Web App URL check karein.
          </td></tr>`;
      }
    }

    function updateMetrics(data) {
      document.getElementById("totalCases").innerText = data.length;
      const issued = data.filter(d => d.status.toUpperCase().includes("ISSUED")).length;
      document.getElementById("issuedCases").innerText = issued;
      document.getElementById("pendingCases").innerText = data.length - issued;
    }

    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      if(data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color: #64748b;">No matching records found.</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map((item, idx) => {
        const isIssued = item.status.toUpperCase().includes('ISSUED');
        return `
          <tr>
            <td>${idx + 1}</td>
            <td><b style="color:#fff">${item.vehicleNo}</b></td>
            <td><span class="badge-status ${isIssued ? 'badge-issued' : 'badge-pending'}">${item.status}</span></td>
            <td>${item.state}</td>
            <td><button class="btn-action" onclick="showDetails(${item.id - 1})">View Details</button></td>
          </tr>
        `;
      }).join('');
    }

    function filterData() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const status = document.getElementById("statusFilter").value.toUpperCase();

      const filtered = fullData.filter(item => {
        const matchesSearch = item.vehicleNo.toLowerCase().includes(search) || item.imei.toLowerCase().includes(search);
        const matchesStatus = status === 'ALL' || item.status.toUpperCase().includes(status);
        return matchesSearch && matchesStatus;
      });

      renderTable(filtered);
    }

    function showDetails(index) {
      const item = fullData[index];
      document.getElementById("modalTitle").innerHTML = `🚚 <span>${item.vehicleNo}</span>`;
      
      const modalContent = `
        <div class="detail-card"><span class="detail-key">DATE</span><div class="detail-val">${item.date}</div></div>
        <div class="detail-card"><span class="detail-key">PORTAL</span><div class="detail-val">${item.portal}</div></div>
        <div class="detail-card"><span class="detail-key">IMEI</span><div class="detail-val">${item.imei}</div></div>
        <div class="detail-card"><span class="detail-key">VLTD SERIAL</span><div class="detail-val">${item.vltd}</div></div>
        <div class="detail-card"><span class="detail-key">ICCID</span><div class="detail-val">${item.iccid}</div></div>
        <div class="detail-card"><span class="detail-key">STATE</span><div class="detail-val">${item.state}</div></div>
        <div class="detail-card"><span class="detail-key">PERMIT HOLDER</span><div class="detail-val">${item.holder}</div></div>
        <div class="detail-card"><span class="detail-key">CONTACT NO.</span><div class="detail-val">${item.phone}</div></div>
      `;

      document.getElementById("modalBody").innerHTML = modalContent;
      document.getElementById("detailsModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("detailsModal").style.display = "none";
    }

    fetchData();
  </script>
</body>
</html>
