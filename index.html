<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PAA STATE DASHBOARD</title>
  
  <!-- Apple Official Typography (SF Pro / Inter) & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      /* Classic Apple Minimalist Palette */
      --bg-color: #f5f5f7;                 /* Apple Signature Off-White */
      --card-bg: #ffffff;                  /* Pure White Container */
      --card-border: rgba(0, 0, 0, 0.08);   /* Subtle Soft Border */
      
      --text-primary: #1d1d1f;             /* Apple Deep Charcoal */
      --text-secondary: #86868b;           /* Muted Gray Text */
      
      --apple-blue: #0071e3;               /* Apple Classic Interactive Blue */
      --apple-blue-hover: #0077ed;
      
      --status-issued: #28cd41;            /* Apple Soft Green */
      --status-pending: #ff3b30;           /* Apple Soft Red */
      --status-action: #ff9500;            /* Apple Soft Orange */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    
    body { 
      background-color: var(--bg-color);
      color: var(--text-primary); 
      padding: 32px 20px; 
      min-height: 100vh; 
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Classic Apple Glass-Style Header */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      background: var(--card-bg);
      padding: 24px 32px;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }

    .header-title-box h1 { 
      font-size: 24px; 
      font-weight: 700; 
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .header-title-box p { 
      font-size: 13px; 
      color: var(--text-secondary); 
      margin-top: 2px; 
      font-weight: 400;
    }

    .header-badge { 
      background: #f2f2f7; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 12px; 
      font-weight: 500; 
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .header-badge .dot {
      width: 7px; height: 7px; background: var(--status-issued); border-radius: 50%;
    }

    /* Minimalist Metric Cards Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 32px;
    }

    .metric-card {
      background: var(--card-bg);
      padding: 22px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .metric-card p { 
      font-size: 12px; 
      color: var(--text-secondary); 
      font-weight: 500; 
      letter-spacing: -0.1px;
    }
    
    .metric-card h2 { 
      font-size: 32px; 
      font-weight: 600; 
      color: var(--text-primary); 
      margin-top: 8px; 
      letter-spacing: -0.8px;
    }

    /* Main Section Card */
    .main-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 24px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .filter-bar { 
      display: flex; 
      flex-direction: column;
      gap: 12px; 
      margin-bottom: 24px; 
    }
    
    .filter-group { display: flex; flex-direction: column; gap: 12px; width: 100%; }

    .search-wrapper { position: relative; width: 100%; }
    .search-wrapper i { 
      position: absolute; 
      left: 14px; 
      top: 50%; 
      transform: translateY(-50%); 
      color: var(--text-secondary); 
      font-size: 13px;
    }
    
    .search-input {
      width: 100%; 
      padding: 10px 14px 10px 38px; 
      border: 1px solid var(--card-border); 
      border-radius: 10px; 
      font-size: 13.5px; 
      outline: none; 
      background: #f2f2f7;
      color: var(--text-primary);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      background: #ffffff;
      border-color: var(--apple-blue);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.12);
    }

    .select-filter { 
      width: 100%;
      padding: 10px 14px; 
      border: 1px solid var(--card-border); 
      border-radius: 10px; 
      font-size: 13.5px; 
      outline: none; 
      background: #f2f2f7; 
      color: var(--text-primary); 
      cursor: pointer;
    }

    .btn-export { 
      width: 100%;
      justify-content: center;
      background: var(--apple-blue); 
      color: #ffffff; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 10px; 
      font-size: 13px; 
      font-weight: 500; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      transition: background 0.2s ease;
    }

    .btn-export:hover {
      background: var(--apple-blue-hover);
    }

    /* Apple-style Table */
    .table-container { 
      overflow-x: auto; 
      border-radius: 12px; 
      border: 1px solid var(--card-border); 
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; min-width: 500px; }
    
    thead tr { background-color: #fafafa; border-bottom: 1px solid var(--card-border); }
    th { padding: 12px 18px; font-weight: 500; color: var(--text-secondary); font-size: 12px; }
    td { padding: 14px 18px; border-bottom: 1px solid var(--card-border); vertical-align: middle; color: var(--text-primary); }

    .btn-vehicle {
      background: transparent; 
      color: var(--apple-blue); 
      font-weight: 600; 
      border: none;
      font-size: 13.5px;
      cursor: pointer;
      padding: 0;
    }
    
    .btn-vehicle:hover { text-decoration: underline; }

    .btn-view {
      background: #f2f2f7; 
      color: var(--text-primary); 
      font-weight: 500; 
      padding: 5px 12px; 
      border-radius: 6px; 
      border: 1px solid var(--card-border); 
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-view:hover { background: #e5e5ea; }

    /* Minimalist Dot Badges (Classic Apple Style) */
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-issued-dot { background-color: var(--status-issued); }
    .status-pending-dot { background-color: var(--status-pending); }
    .status-action-dot { background-color: var(--status-action); }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3); 
      backdrop-filter: blur(8px); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 1000;
      padding: 16px;
    }

    .modal-card { 
      background: #ffffff; 
      width: 100%; 
      max-width: 500px; 
      border-radius: 18px; 
      overflow: hidden; 
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); 
    }

    .modal-header { 
      background: #fafafa; 
      color: var(--text-primary); 
      padding: 16px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--card-border);
    }
    .modal-header h3 { font-size: 15px; font-weight: 600; }

    .close-modal { 
      background: #e5e5ea; 
      border: none; 
      color: var(--text-primary); 
      width: 26px; 
      height: 26px; 
      border-radius: 50%; 
      font-size: 16px; 
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body { padding: 20px; max-height: 70vh; overflow-y: auto; }
    .detail-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    
    .detail-item { 
      background: #f2f2f7; 
      padding: 10px 12px; 
      border-radius: 8px; 
    }
    .detail-label { font-size: 11px; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; }
    .detail-value { font-size: 13px; color: var(--text-primary); font-weight: 500; margin-top: 3px; word-break: break-word; }

    #loader { text-align: center; padding: 40px 10px; color: var(--text-secondary); font-weight: 500; font-size: 14px; }

    @media (min-width: 768px) {
      .filter-bar { flex-direction: row; justify-content: space-between; }
      .filter-group { flex-direction: row; width: auto; }
      .search-wrapper { width: 300px; }
      .btn-export { width: auto; }
      .detail-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Title & Managed By Header -->
    <div class="dashboard-header">
      <div class="header-left">
        <img src="https://ui-avatars.com/api/?name=Mratyunjay&background=0071e3&color=fff&size=128" alt="Mratyunjay" class="user-avatar">
        <div class="header-title-box">
          <h1>PAA STATE DASHBOARD</h1>
          <!-- Updated Managed By Mratyunjay -->
          <p>Managed by <strong>Mratyunjay</strong></p>
        </div>
      </div>

      <div class="header-right">
        <div class="header-badge">
          <span class="dot"></span> System Online
        </div>
      </div>
    </div>

    <!-- Classic Apple Metric Cards Grid -->
    <div class="metrics-grid">
      <!-- Total Cases -->
      <div class="metric-card" onclick="filterByCard('ALL')">
        <p>Total Cases</p>
        <h2 id="totalCases">0</h2>
      </div>

      <!-- Certificate Issue -->
      <div class="metric-card" onclick="filterByCard('ISSUED')">
        <p>Certificate Issue</p>
        <h2 id="issuedCount">0</h2>
      </div>

      <!-- Pending -->
      <div class="metric-card" onclick="filterByCard('PENDING')">
        <p>Pending</p>
        <h2 id="pendingCount">0</h2>
      </div>

      <!-- Need Action -->
      <div class="metric-card" onclick="filterByCard('NEED_ACTION')">
        <p>Need Action</p>
        <h2 id="actionableCount">0</h2>
      </div>
    </div>

    <!-- Main Table Container Card -->
    <div class="main-card">
      <div class="filter-bar">
        <div class="filter-group">
          <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search vehicle, permit holder..." onkeyup="applyFilters()">
          </div>
          <select id="remarkFilter" class="select-filter" onchange="applyFilters()">
            <option value="ALL">All Status</option>
            <option value="ISSUED">Certificate Issued</option>
            <option value="PENDING">Total Pending</option>
            <option value="NEED_ACTION">Need Action</option>
          </select>
        </div>
        <button class="btn-export" onclick="exportDataToCSV()"><i class="fa-solid fa-arrow-down-long"></i> Export CSV</button>
      </div>

      <div id="loader"><i class="fa-solid fa-spinner fa-spin"></i> Loading Data...</div>

      <div class="table-container" id="tableWrapper" style="display: none;">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Vehicle No.</th>
              <th>Status</th>
              <th>Permit Holder</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalVehicleTitle">Vehicle Details</h3>
        <button class="close-modal" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="detail-grid" id="modalDetailContent"></div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ APNA GOOGLE APPS SCRIPT URL HERE PASTE KAREIN
    const API_URL = "https://script.google.com/macros/s/AKfycbyHslvgv_ZLu_tkuxi6Pi3jBxbiCnzTlYSBy6YVoVIg53JBPDqzFXcvtbyjrlAnWiE/exec";

    let rawData = [];
    let currentFilteredData = [];

    function loadDataWithJSONP() {
      const script = document.createElement('script');
      script.src = API_URL + "?callback=handleDataResponse";
      script.onerror = function() {
        document.getElementById('loader').innerHTML = "<span style='color:var(--status-pending);'>Unable to load data. Please check Web App URL.</span>";
      };
      document.body.appendChild(script);
    }

    function handleDataResponse(data) {
      if (!data || data.length === 0 || data.error) {
        document.getElementById('loader').innerHTML = "<span style='color:var(--status-pending);'>No records found in Google Sheet.</span>";
        return;
      }

      rawData = data;
      currentFilteredData = rawData;

      populateRemarkFilter(rawData);
      calculateMetrics(rawData);
      renderTable(rawData);

      document.getElementById('loader').style.display = 'none';
      document.getElementById('tableWrapper').style.display = 'block';
    }

    function getVal(row, possibleNames) {
      if (!row) return '';
      const keys = Object.keys(row);
      
      for (let name of possibleNames) {
        let matchedKey = keys.find(k => k.toLowerCase().trim() === name.toLowerCase().trim());
        if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== '') {
          return row[matchedKey];
        }
      }

      for (let name of possibleNames) {
        let matchedKey = keys.find(k => k.toLowerCase().includes(name.toLowerCase()));
        if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== '') {
          return row[matchedKey];
        }
      }
      return '';
    }

    function populateRemarkFilter(data) {
      const dropdown = document.getElementById('remarkFilter');
      let optionsHTML = `
        <option value="ALL">All Status</option>
        <option value="ISSUED">Certificate Issued</option>
        <option value="PENDING">Total Pending</option>
        <option value="NEED_ACTION">Need Action</option>
        <option disabled>──────────</option>
      `;

      const uniqueRemarks = new Set();
      data.forEach(row => {
        let remark = getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']);
        if (remark && remark.toString().trim() !== '') {
          uniqueRemarks.add(remark.toString().trim());
        }
      });

      Array.from(uniqueRemarks).sort().forEach(rem => {
        optionsHTML += `<option value="EXACT:${rem}">${rem}</option>`;
      });

      dropdown.innerHTML = optionsHTML;
    }

    function getVehicleNumber(row) {
      let veh = getVal(row, ['Vehicle Reg No', 'Vehicle Registration No', 'Vehicle Number', 'Vehicle No', 'Veh No', 'Reg No']);
      if (veh && !veh.toUpperCase().startsWith('TRAX') && !veh.toUpperCase().startsWith('IMEI') && veh.length < 15) {
        return veh;
      }
      const keys = Object.keys(row);
      for (let k of keys) {
        let val = (row[k] || '').toString().trim();
        if (val.match(/^[A-Z]{2}[0-9]{1,2}[A-Z]{0,3}[0-9]{4}$/i)) return val;
      }
      return veh || 'N/A';
    }

    function isNeedActionStatus(remark) {
      let rem = remark.toString().toLowerCase();
      return rem.includes('activation pending') || rem.includes('check not clear') || rem.includes('topup pending') || rem.includes('top up pending');
    }

    function calculateMetrics(data) {
      let total = data.length, issued = 0, pending = 0, needAction = 0;
      data.forEach(row => {
        let remark = (getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']) || '').toString();
        let remLower = remark.toLowerCase();
        if (remLower.includes('issued') || remLower.includes('done') || remLower.includes('completed')) {
          issued++;
        } else {
          pending++;
        }
        if (isNeedActionStatus(remark)) needAction++;
      });

      document.getElementById('totalCases').innerText = total;
      document.getElementById('issuedCount').innerText = issued;
      document.getElementById('pendingCount').innerText = pending;
      document.getElementById('actionableCount').innerText = needAction;
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--text-secondary);">No records found.</td></tr>`;
        return;
      }

      data.forEach((row, index) => {
        const vehicleNo = getVehicleNumber(row);
        const remark = getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']) || 'Pending';
        const permitHolder = getVal(row, ['Permit Holder', 'Permit Holder Name', 'PermitHolder', 'Owner Name', 'Owner', 'Customer Name', 'Party Name']) || '-';

        let statusDotClass = 'status-action-dot';
        let remLower = remark.toString().toLowerCase();

        if (remLower.includes('issued') || remLower.includes('done') || remLower.includes('completed')) {
          statusDotClass = 'status-issued-dot';
        } else if (remLower.includes('deboarded') || remLower.includes('failed') || remLower.includes('pending')) {
          statusDotClass = 'status-pending-dot';
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span style="color:var(--text-secondary);">${index + 1}</span></td>
          <td>
            <button class="btn-vehicle" onclick="openVehicleDetail(${index})">
              ${vehicleNo}
            </button>
          </td>
          <td><span class="status-dot ${statusDotClass}"></span>${remark}</td>
          <td>${permitHolder}</td>
          <td>
            <button class="btn-view" onclick="openVehicleDetail(${index})">
              View
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterByCard(filterType) {
      const dropdown = document.getElementById('remarkFilter');
      if (dropdown) {
        dropdown.value = filterType;
        applyFilters();
      }
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('remarkFilter').value;

      currentFilteredData = rawData.filter(row => {
        const matchesSearch = Object.values(row).some(v => 
          v !== null && v !== undefined && v.toString().toLowerCase().includes(query)
        );
        const remark = (getVal(row, ['Remarks', 'Remark', 'Portal Status', 'Portal', 'Status']) || '').toString();
        let remLower = remark.toLowerCase();
        let matchesStatus = true;

        if (statusFilter === 'ISSUED') {
          matchesStatus = remLower.includes('issued') || remLower.includes('done') || remLower.includes('completed');
        } else if (statusFilter === 'PENDING') {
          matchesStatus = !remLower.includes('issued') && !remLower.includes('done') && !remLower.includes('completed');
        } else if (statusFilter === 'NEED_ACTION') {
          matchesStatus = isNeedActionStatus(remark);
        } else if (statusFilter.startsWith('EXACT:')) {
          let exactVal = statusFilter.replace('EXACT:', '');
          matchesStatus = (remark.trim() === exactVal);
        }

        return matchesSearch && matchesStatus;
      });

      renderTable(currentFilteredData);
    }

    function openVehicleDetail(index) {
      const rowData = currentFilteredData[index];
      const vehicleNo = getVehicleNumber(rowData);

      document.getElementById('modalVehicleTitle').innerText = vehicleNo;
      const modalContent = document.getElementById('modalDetailContent');
      modalContent.innerHTML = '';

      Object.keys(rowData).forEach(key => {
        let val = rowData[key];
        if (val === undefined || val === '') val = '-';
        if (typeof val === 'string' && val.includes('T') && val.includes('Z')) val = val.split('T')[0];

        const item = document.createElement('div');
        item.className = 'detail-item';
        item.innerHTML = `<div class="detail-label">${key}</div><div class="detail-value">${val}</div>`;
        modalContent.appendChild(item);
      });

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

    function exportDataToCSV() {
      if (!currentFilteredData || currentFilteredData.length === 0) return alert("Export ke liye koi data nahi hai!");
      let csv = '';
      const headers = Object.keys(currentFilteredData[0]);
      csv += headers.join(',') + '\n';
      currentFilteredData.forEach(row => {
        csv += headers.map(h => `"${(row[h]||'').toString().replace(/"/g, '""')}"`).join(',') + '\n';
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = window.URL.createObjectURL(blob);
      a.download = `PAA_State_Data_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    window.onclick = function(event) {
      const modal = document.getElementById('detailModal');
      if (event.target === modal) closeModal();
    };

    loadDataWithJSONP();
  </script>
</body>
</html>
